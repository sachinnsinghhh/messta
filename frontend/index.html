    <script>
      // Early capture of beforeinstallprompt so direct 1-tap install prompt is never missed
      window.messtaDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.messtaDeferredPrompt = e;
        if (typeof window.__onMesstaPromptReady === 'function') {
          window.__onMesstaPromptReady(e);
        }
      });
      // Register service worker to ensure instant Chrome PWA installability eligibility
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.warn('SW registration:', err);
          });
        });
      }
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
